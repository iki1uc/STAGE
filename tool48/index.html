<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 3‑SPIEGEL · RESPO‑9×9 · HOLO‑RAUM · 360°</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#05070e;
    color:#c0d0d0;
    font-family:'Segoe UI','Consolas',monospace;
    overflow:hidden;
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  #ui {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(6,8,16,0.8);
    backdrop-filter:blur(8px);
    border-radius:20px;
    border:1px solid rgba(120,220,150,0.15);
    padding:12px 20px;
    display:flex;
    flex-wrap:wrap;
    gap:12px 20px;
    align-items:center;
    justify-content:center;
    z-index:10;
    max-width:95vw;
    box-shadow:0 10px 40px rgba(0,0,0,0.8);
    pointer-events:auto;
  }
  #ui label { font-size:11px; color:#8aa8a0; display:flex; align-items:center; gap:8px; }
  #ui input[type=range] { width:80px; accent-color:#7ee0a0; cursor:pointer; }
  #ui button {
    background:rgba(20,28,20,0.5); border:1px solid rgba(120,220,150,0.2);
    border-radius:10px; padding:5px 12px; color:#c0d8c8; font-family:inherit;
    font-size:11px; cursor:pointer; transition:0.2s;
  }
  #ui button:hover { border-color:#7ee0a0; background:rgba(80,180,110,0.15); color:#fff; }
  #ui button.active { border-color:#f0d080; color:#f0d080; }
  #stats {
    position:fixed;
    top:16px;
    right:20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(4px);
    border-radius:12px;
    padding:8px 14px;
    font-size:10px;
    color:#6a8a7a;
    border:1px solid rgba(120,220,150,0.08);
    pointer-events:none;
    z-index:10;
    line-height:1.6;
    text-align:right;
  }
  #stats .val { color:#a0e0b0; font-weight:bold; }
  #log {
    position:fixed;
    bottom:90px;
    left:20px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(4px);
    border-radius:10px;
    padding:6px 12px;
    font-size:9px;
    color:#5a7a6a;
    max-height:80px;
    overflow-y:auto;
    border:1px solid rgba(120,220,150,0.06);
    pointer-events:none;
    z-index:10;
    width:260px;
    line-height:1.4;
  }
  #log .entry { border-bottom:1px solid rgba(100,180,150,0.03); padding:1px 0; }
  #log .time { color:#2a3a3a; }
  #log .msg { color:#8aa8a0; }
  canvas { display:block; width:100vw; height:100vh; background:#05070e; }
</style>
</head>
<body>

<div id="stats">
  <div>🌀 RESPO‑9×9</div>
  <div>Score: <span class="val" id="statsScore">0%</span></div>
  <div>Gear: <span class="val" id="statsGear">0</span></div>
  <div>Mode: <span class="val" id="statsMode">360°</span></div>
</div>

<div id="log"></div>

<div id="ui">
  <label>🌀 Rotation <input type="range" id="rotSlider" min="0" max="360" value="0"> <span id="rotVal">0°</span></label>
  <label>📐 Neigung <input type="range" id="tiltSlider" min="0" max="30" value="12"> <span id="tiltVal">12°</span></label>
  <label>🔮 Tiefe <input type="range" id="depthSlider" min="50" max="250" value="140"> <span id="depthVal">140</span></label>
  <button id="btnPose1">Offen</button>
  <button id="btnPose2">Diamant</button>
  <button id="btnPose3">Kill‑Bill</button>
  <button id="btnPose4" class="active">360°</button>
  <button id="btnRespo">🎲 Respo</button>
  <button id="btnReset">⟲ Reset</button>
</div>

<!-- Canvas für 3D‑Szene -->
<canvas id="canvas"></canvas>

<script>
"use strict";

// ================================================================
//  3‑SPIEGEL · RESPO‑9×9 · HOLO‑RAUM · 360°
//  Three.js-basierte 3D‑Szene mit Orbit‑Steuerung (Maus + Slider)
//  und 9×9‑Respo‑Punkten, die live die Slots abbilden.
// ================================================================

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// ─── SCENE SETUP ──────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070e);
scene.fog = new THREE.Fog(0x05070e, 8, 18);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 30);
camera.position.set(6, 4, 8);
camera.lookAt(0,0,0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = false;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.target.set(0, 0, 0);

// ─── LIGHTS ──────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x222244, 0.8);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffeedd, 2.5);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.6);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x88ddff, 0.4);
rimLight.position.set(0, -3, 5);
scene.add(rimLight);

// ─── RESPO‑9×9 SYSTEM ──────────────────────────────────────────
const RESPO_SIZE = 9;
const TOTAL = 81;
const respoSlots = [];
let respoValues = new Float32Array(TOTAL);
let respoTime = 0;
let gear = 0;

// Bodenraster (freie Innenfläche, klickbar wird später über Raycaster)
const gridHelper = new THREE.GridHelper(6, 9, 0x44aa77, 0x226644);
gridHelper.position.y = -0.55;
scene.add(gridHelper);

// Punktewolke für Respo
const pointGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(TOTAL * 3);
const colors = new Float32Array(TOTAL * 3);
const sizes = new Float32Array(TOTAL);

// Positionen: 9×9 auf einer leicht gewölbten Fläche
let idx = 0;
for (let r = 0; r < RESPO_SIZE; r++) {
  for (let c = 0; c < RESPO_SIZE; c++) {
    const x = (c / (RESPO_SIZE-1) - 0.5) * 5.0;
    const z = (r / (RESPO_SIZE-1) - 0.5) * 5.0;
    const y = -0.3 + 0.1 * Math.sin(r*0.7 + c*0.5) * 0.8;
    positions[idx*3] = x;
    positions[idx*3+1] = y;
    positions[idx*3+2] = z;
    colors[idx*3] = 0.2;
    colors[idx*3+1] = 0.6;
    colors[idx*3+2] = 0.8;
    sizes[idx] = 0.08;
    idx++;
  }
}
pointGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pointGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
pointGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const pointMaterial = new THREE.PointsMaterial({
  size: 0.18,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});
const respoPoints = new THREE.Points(pointGeometry, pointMaterial);
scene.add(respoPoints);

// Kugeln für jeden Slot (visuell prägnanter)
const spheres = [];
for (let i = 0; i < TOTAL; i++) {
  const geo = new THREE.SphereGeometry(0.12, 8, 8);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(0.3, 0.7, 0.9),
    emissive: new THREE.Color(0.1, 0.3, 0.5),
    emissiveIntensity: 0.3,
    roughness: 0.2,
    metalness: 0.6,
  });
  const mesh = new THREE.Mesh(geo, mat);
  const pos = pointGeometry.attributes.position.array;
  mesh.position.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
  mesh.castShadow = true;
  scene.add(mesh);
  spheres.push(mesh);
}

// ─── 3 SPIEGEL (Glieder) ──────────────────────────────────────
const mirrorGroup = new THREE.Group();
scene.add(mirrorGroup);

function createMirror(color, label) {
  const group = new THREE.Group();
  const geometry = new THREE.PlaneGeometry(1.8, 2.4);
  const material = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 0.05,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.35,
    roughness: 0.1,
    metalness: 0.9,
    envMapIntensity: 0.8,
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  // Rahmen
  const frame = new THREE.EdgesGeometry(geometry);
  const lineMat = new THREE.LineBasicMaterial({ color: 0x88ddbb, transparent:true, opacity:0.2 });
  const line = new THREE.LineSegments(frame, lineMat);
  group.add(line);

  // Label (als Sprite, kleiner Text)
  const canvas2 = document.createElement('canvas');
  canvas2.width = 128; canvas2.height = 48;
  const ctx2 = canvas2.getContext('2d');
  ctx2.fillStyle = 'rgba(0,0,0,0)';
  ctx2.fillRect(0,0,128,48);
  ctx2.font = 'bold 20px Consolas';
  ctx2.textAlign = 'center';
  ctx2.textBaseline = 'middle';
  ctx2.fillStyle = '#88ddbb';
  ctx2.fillText(label, 64, 24);
  const texture = new THREE.CanvasTexture(canvas2);
  const spriteMat = new THREE.SpriteMaterial({ map:texture, transparent:true, depthTest:false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(0.6, 0.22, 1);
  sprite.position.z = 0.01;
  group.add(sprite);

  return group;
}

const mirrorLeft = createMirror(0x0088ff, 'LINKS');
mirrorLeft.position.set(-1.8, 0.0, 0);
mirrorLeft.rotation.y = 0.3;  // 12° nach innen
mirrorGroup.add(mirrorLeft);

const mirrorRight = createMirror(0xff44aa, 'RECHTS');
mirrorRight.position.set(1.8, 0.0, 0);
mirrorRight.rotation.y = -0.3;
mirrorGroup.add(mirrorRight);

const mirrorFront = createMirror(0x88ddff, 'FRONT');
mirrorFront.position.set(0, 0.3, 1.2);
mirrorFront.rotation.x = -0.2; // 13° nach hinten
mirrorGroup.add(mirrorFront);

// ─── SCENE‑ZUSTAND ──────────────────────────────────────────────
let sceneMode = '360'; // offen, diamant, killbill, 360
let rotY = 0;
let tilt = 12; // Grad
let depth = 140;

function applyPose(pose) {
  // Pose: { left: {rotY, rotX, posZ}, right: {…}, front: {…} }
  // Wir übersetzen das in die 3D‑Gruppen‑Transformationen
  // left/right: rotation.y = rotY (rad), position.z = posZ/100
  // front: rotation.x = -rotX (rad), position.z = posZ/100
  const rad = deg => deg * Math.PI / 180;
  const l = pose.left || {rotY:12, rotX:2, posZ:80};
  const r = pose.right || {rotY:-12, rotX:2, posZ:80};
  const f = pose.front || {rotY:0, rotX:13, posZ:140};

  mirrorLeft.rotation.y = rad(l.rotY);
  mirrorLeft.position.z = l.posZ / 100;
  mirrorLeft.rotation.x = rad(l.rotX);
  mirrorRight.rotation.y = rad(r.rotY);
  mirrorRight.position.z = r.posZ / 100;
  mirrorRight.rotation.x = rad(r.rotX);
  mirrorFront.rotation.x = -rad(f.rotX);
  mirrorFront.position.z = f.posZ / 100;
  mirrorFront.rotation.y = rad(f.rotY);
}

const poses = {
  offen: {
    left: {rotY:30, rotX:2, posZ:40},
    right: {rotY:-30, rotX:2, posZ:40},
    front: {rotY:0, rotX:8, posZ:100}
  },
  diamant: {
    left: {rotY:12, rotX:2, posZ:80},
    right: {rotY:-12, rotX:2, posZ:80},
    front: {rotY:0, rotX:13, posZ:140}
  },
  killbill: {
    left: {rotY:40, rotX:-10, posZ:10},
    right: {rotY:-40, rotX:-10, posZ:10},
    front: {rotY:0, rotX:4, posZ:170}
  },
  '360': {
    left: {rotY:20, rotX:0, posZ:120},
    right: {rotY:-20, rotX:0, posZ:120},
    front: {rotY:0, rotX:5, posZ:200}
  }
};

// ─── RESPO‑UPDATE ──────────────────────────────────────────────
function updateRespo() {
  const pos = pointGeometry.attributes.position.array;
  const col = pointGeometry.attributes.color.array;
  const sizes = pointGeometry.attributes.size.array;

  let sum = 0;
  for (let i = 0; i < TOTAL; i++) {
    const val = Math.sin(i * 0.2 + respoTime * 0.0008) * 0.6 + 0.5;
    respoValues[i] = Math.max(0, Math.min(1, val));
    sum += respoValues[i];

    // Höhe (y) leicht modulieren
    const yOffset = (respoValues[i] - 0.5) * 0.6;
    pos[i*3+1] = -0.3 + yOffset * 0.5;

    // Farbe: von blau-grün zu gold
    const r = 0.2 + 0.8 * respoValues[i];
    const g = 0.6 + 0.4 * respoValues[i];
    const b = 0.8 - 0.6 * respoValues[i];
    col[i*3] = r;
    col[i*3+1] = g;
    col[i*3+2] = b;

    sizes[i] = 0.06 + 0.18 * respoValues[i];

    // Kugeln aktualisieren
    const mesh = spheres[i];
    mesh.position.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
    mesh.material.color.setRGB(r, g, b);
    const scale = 0.6 + 1.2 * respoValues[i];
    mesh.scale.set(scale, scale, scale);
  }
  pointGeometry.attributes.position.needsUpdate = true;
  pointGeometry.attributes.color.needsUpdate = true;
  pointGeometry.attributes.size.needsUpdate = true;

  const avg = sum / TOTAL;
  document.getElementById('statsScore').textContent = Math.round(avg * 100) + '%';
  document.getElementById('statsGear').textContent = gear;
  document.getElementById('statsMode').textContent = sceneMode.toUpperCase();
}

// ─── CONTROLS ──────────────────────────────────────────────────
let isRotating = false;
document.getElementById('rotSlider').addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  document.getElementById('rotVal').textContent = Math.round(val) + '°';
  mirrorGroup.rotation.y = val * Math.PI / 180;
});
document.getElementById('tiltSlider').addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  document.getElementById('tiltVal').textContent = Math.round(val) + '°';
  // tilt beeinflusst die Neigung der Spiegel insgesamt – wir passen die Front an
  mirrorFront.rotation.x = -val * Math.PI / 180;
});
document.getElementById('depthSlider').addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  document.getElementById('depthVal').textContent = Math.round(val);
  // Tiefe beeinflusst alle Spiegel gleichmäßig
  const factor = val / 140;
  mirrorLeft.position.z = 0.8 * factor;
  mirrorRight.position.z = 0.8 * factor;
  mirrorFront.position.z = 1.2 * factor;
});

// Szenarien
const poseButtons = {
  offen: document.getElementById('btnPose1'),
  diamant: document.getElementById('btnPose2'),
  killbill: document.getElementById('btnPose3'),
  '360': document.getElementById('btnPose4')
};
Object.keys(poseButtons).forEach(key => {
  poseButtons[key].addEventListener('click', () => {
    Object.values(poseButtons).forEach(b => b.classList.remove('active'));
    poseButtons[key].classList.add('active');
    sceneMode = key;
    applyPose(poses[key]);
    // Slider nachziehen
    const p = poses[key];
    const l = p.left;
    document.getElementById('rotSlider').value = l.rotY;
    document.getElementById('rotVal').textContent = Math.round(l.rotY) + '°';
    document.getElementById('tiltSlider').value = l.rotX;
    document.getElementById('tiltVal').textContent = Math.round(l.rotX) + '°';
    document.getElementById('depthSlider').value = l.posZ;
    document.getElementById('depthVal').textContent = Math.round(l.posZ);
    log(`⭐ Pose: ${key}`);
  });
});

document.getElementById('btnRespo').addEventListener('click', () => {
  // Zufällige Respo-Werte anstoßen
  for (let i = 0; i < TOTAL; i++) {
    respoValues[i] = Math.random();
  }
  log('🎲 Respo randomisiert');
});

document.getElementById('btnReset').addEventListener('click', () => {
  // Szene zurücksetzen
  mirrorGroup.rotation.y = 0;
  document.getElementById('rotSlider').value = 0;
  document.getElementById('rotVal').textContent = '0°';
  applyPose(poses.diamant);
  document.getElementById('tiltSlider').value = 12;
  document.getElementById('tiltVal').textContent = '12°';
  document.getElementById('depthSlider').value = 140;
  document.getElementById('depthVal').textContent = '140';
  Object.values(poseButtons).forEach(b => b.classList.remove('active'));
  poseButtons.diamant.classList.add('active');
  sceneMode = 'diamant';
  log('⟲ Reset');
});

function log(msg) {
  const box = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  const e = document.createElement('div');
  e.className = 'entry';
  e.innerHTML = `<span class="time">[${t}]</span> <span class="msg">${msg}</span>`;
  box.appendChild(e);
  box.scrollTop = box.scrollHeight;
  if (box.children.length > 30) box.removeChild(box.firstChild);
}

// ─── ANIMATION LOOP ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  respoTime += 16;
  gear = (gear + 1) % 12;
  if (respoTime % 120 < 16) updateRespo(); // alle 120ms updaten

  controls.update();
  renderer.render(scene, camera);
}

// ─── RESIZE ─────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ─── INIT ──────────────────────────────────────────────────────
applyPose(poses.diamant);
updateRespo();
log('🌀 3‑SPIEGEL · RESPO‑9×9 · HOLO‑RAUM gestartet');
log('🖱️ Maus ziehen = 360° drehen · Slider justieren');
animate();

</script>

</body>
</html>
