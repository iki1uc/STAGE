<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛗 ROOT · STAGE‑Reich</title>

<!-- Zentrale Module -->
<script src="coord.js"></script>
<script src="aufzug.js"></script>
<script src="OS_CORE.js"></script>

<!-- Achsen‑Module -->
<script src="b/axiom.map.js"></script>
<script src="h/axiom.map.js"></script>
<script src="t/axiom.map.js"></script>

<!-- NC‑Module -->
<script src="NC_figur.js"></script>
<script src="NC_kraft.js"></script>
<script src="NC_space.js"></script>
<script src="NC_time.js"></script>

<!-- VEC‑Module -->
<script src="vec.js"></script>
<script src="vec3.js"></script>
<script src="vec9.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0b0b0b; color:#e0e0e0; font-family:Consolas, monospace;
    min-height:100vh;
  }
  .content { max-width:1000px; margin:0 auto; padding:24px 20px; }
  h1 { color:#6cf; font-size:24px; margin-bottom:6px; }
  p.sub { color:#5a7a8a; font-size:12px; margin-bottom:20px; }

  .grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px; margin-bottom:24px;
  }
  .card {
    background:#111; border:1px solid #2a3a4a; border-radius:10px;
    padding:16px; text-decoration:none; color:#e0e0e0; display:block;
    transition:.2s;
  }
  .card:hover { border-color:#6cf; transform:translateY(-2px); }
  .card .icon { font-size:26px; }
  .card .name { font-size:13px; margin-top:6px; color:#d0e0e8; }
  .card .path { font-size:9px; color:#4a5a6a; margin-top:4px; }

  h3 { color:#f0d080; font-size:13px; margin:18px 0 8px; }
  #coordBox, #logBox {
    background:#111; padding:10px 14px; border-radius:8px;
    border:1px solid #2a3a4a; font-size:11px; line-height:1.6;
  }
</style>
</head>

<body>
<div class="content">

  <h1>🛗 ROOT · STAGE‑Reich</h1>
  <p class="sub">Alle Achsen, Etagen, Module und Koordinaten des Reichs.</p>

  <!-- Etagen -->
  <h3>🏢 ETAGEN</h3>
  <div class="grid" id="floorGrid"></div>

  <!-- Koordinaten -->
  <h3>🧭 KOORDINATEN‑SYSTEM (b/h/t + Stages)</h3>
  <div id="coordBox">Koordinaten werden geladen…</div>

  <!-- Log -->
  <h3>📜 GETEILTES LOG</h3>
  <div id="logBox"></div>

</div>

<script>
  // ───────────────────────────────────────────────
  // 1. Etagen anzeigen
  // ───────────────────────────────────────────────
  const grid = document.getElementById('floorGrid');
  Aufzug.FLOORS.filter(f => !f.isRoot).forEach(f => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = f.path;
    a.innerHTML = `
      <div class="icon">${f.icon}</div>
      <div class="name">${f.name}</div>
      <div class="path">${f.path}</div>
    `;
    grid.appendChild(a);
  });

  // ───────────────────────────────────────────────
  // 2. Koordinaten anzeigen
  // ───────────────────────────────────────────────
  function renderCoords() {
    const box = document.getElementById('coordBox');
    const out = [];

    out.push("Achsen:");
    Object.entries(COORD.axes).forEach(([k,v]) => {
      out.push(`• ${k}: ${v}`);
    });

    out.push("<br>Stages:");
    Object.entries(COORD.stages).forEach(([id, c]) => {
      out.push(`• ${id}: (${c.x}, ${c.y}, ${c.z})`);
    });

    box.innerHTML = out.join("<br>");
  }
  renderCoords();

  // ───────────────────────────────────────────────
  // 3. Log anzeigen
  // ───────────────────────────────────────────────
  function renderLog() {
    const box = document.getElementById('logBox');
    const entries = Aufzug.getSharedLog().slice().reverse();
    box.innerHTML = entries.map(e =>
      `<div><span style="color:#2a3a4a;">[${e.time}]</span> <span style="color:#6cf;">${e.floor}</span>: ${e.msg}</div>`
    ).join('');
  }
  renderLog();

  // ───────────────────────────────────────────────
  // 4. ROOT initialisieren
  // ───────────────────────────────────────────────
  Aufzug.init({ currentId: 'root', basePath: '' });
</script>

</body>
</html>
