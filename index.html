<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RESPO.ai · Universum Startpunkt</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas; margin:0; }
  #stagePanel {
    padding:20px;
    background:#111;
    border-bottom:1px solid #333;
  }
  button {
    background:#222; color:#0f0; border:1px solid #333;
    padding:10px 20px; margin-top:10px; cursor:pointer;
  }
</style>

<script type="module">

// 1. STAGE laden
async function loadStage(){
    const res = await fetch("./STAGE/index.html");
    const html = await res.text();
    document.getElementById("stagePanel").innerHTML = html;
}

// 2. NC‑Router (kosmetische Richtung)
const STAGE_ROUTE = {
    S: "./sys/index.html",
    H: "./H/index.html",
    B: "./B/index.html",
    T: "./T/index.html",
    O: "./O/index.html",
    D: "./D/index.html"
};

// 3. OPTA‑Move (operativ 9×9)
function stageEnter(mode){
    return {
        XI: { in: mode },
        IX: { out: mode },
        x4: { move: mode }
    };
}

// 4. Router erst starten, wenn du klickst
function go(mode){
    const move = stageEnter(mode);
    console.log("STAGE‑MOVE:", move);
    window.location.href = STAGE_ROUTE[mode];
}

// 5. STAGE aktivieren
loadStage();

</script>

</head>

<body>

<div id="stagePanel">
  Lade STAGE…
</div>

<button onclick="go('S')">Starten → Sonne</button>

</body>
</html>
